
name: Deploy React Vite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find and build frontend
        run: |
          echo "Repository root:"
          pwd
          echo "Repository contents:"
          ls -la

          echo "Searching for frontend package.json..."
          find . -type f -name package.json \
            -not -path '*/node_modules/*' -print

          PACKAGE_FILE="$(find . -type f \
            -path '*/f2/package.json' \
            -not -path '*/node_modules/*' \
            -print -quit)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: Could not find f2/package.json"
            exit 1
          fi

          FRONTEND_DIR="$(dirname "$PACKAGE_FILE")"
          echo "Frontend directory: $FRONTEND_DIR"

          cd "$FRONTEND_DIR"

          npm ci
          npm run build

          mkdir -p "$GITHUB_WORKSPACE/site"
          cp -a dist/. "$GITHUB_WORKSPACE/site/"

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
